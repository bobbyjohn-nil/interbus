<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Interbus</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- The boot splash (S18, V1's `Intralines@7af45b1:index.html:218-283`): drawn by the page itself, so it shows while the
         game's own files load, in app.css's tokens, which the page reads before it draws. The game ends it once it has a
         screen to show (src/ui/brand/boot.ts): its bus tows it away once a tab, or it goes at once. -->
    <div id="boot">
      <div class="boot-card">
        <div class="boot-bus" aria-hidden="true"><svg width="118" height="72" viewBox="0 0 42 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M 3 15.6 L 3 6.6 Q 3 4 5.6 4 L 32 4 Q 33.8 4 34.4 5.2 L 37 11.6 L 37 15.8 Q 37 17 35.6 17 L 34.1 17 Q 30.6 12.3 27.1 17L 13.0 17 Q 9.5 12.3 6.0 17L 4.4 17 Q 3 17 3 15.6 Z"/><path d="M 29.8 6.4 L 33.1 6.4 L 35.2 11.1 L 29.8 11.1 Z" stroke-width="1.3" opacity=".85"/><rect x="5.4" y="6.4" width="16.6" height="4.3" rx="1.1" stroke-width="1.3" opacity=".85"/><path d="M 10.9 6.4 V 10.7" stroke-width="1.1" opacity=".5"/><path d="M 16.5 6.4 V 10.7" stroke-width="1.1" opacity=".5"/><rect x="23.1" y="5.9" width="2.6" height="10.2" rx="1" stroke-width="1.3" opacity=".75"/><path d="M 24.4 6.2 V 15.8" stroke-width="1" opacity=".45"/><path d="M 5.4 13.4 H 22.0" stroke-width="1.1" opacity=".4"/><circle cx="35.3" cy="14.3" r=".85" fill="currentColor" stroke="none"/><circle cx="30.6" cy="18.5" r="2.7" fill="currentColor" stroke="none"/><circle cx="9.5" cy="18.5" r="2.7" fill="currentColor" stroke="none"/></svg></div>
        <b aria-hidden="true">Interbus</b>
        <span class="boot-line" aria-hidden="true">Warming up the engines…</span>
        <span class="boot-bar" aria-hidden="true"><i></i></span>
        <span class="boot-status" role="status">Loading</span>
      </div>
    </div>
    <script>
      // Depot chatter while the game's files load, for company (GD-08): a line every 950 ms from a random start, until the
      // splash goes. If the game's code has not run in 20 s (its root still empty), or nothing has come in a minute, as the
      // city's 2 MB may take on a slow line, it says to reload instead, to a screen reader too.
      (function () {
        var lines = [
          'Warming up the engines…',
          'Checking the mirrors…',
          'Filling the tanks…',
          'Printing the timetables…',
          'Counting the fare boxes…',
          'Waking the drivers…',
          'Unlocking the depot gates…',
          'Setting the destination signs…',
          'Sweeping out the aisles…',
          'Checking the tire pressures…',
          'Running the safety checks…',
          'Waiting for the first riders…',
        ];
        var stuck = 'Still loading. Reload the page if this stays.';
        var line = document.querySelector('#boot .boot-line');
        var status = document.querySelector('#boot .boot-status');
        if (!line || !status) return;
        var i = Math.floor(Math.random() * lines.length);
        var started = Date.now();
        var root = document.getElementById('root');
        line.textContent = lines[i];
        var every = setInterval(function () {
          if (!document.getElementById('boot')) return clearInterval(every);
          var waited = Date.now() - started;
          if (waited > 60000 || (waited > 20000 && root && !root.hasChildNodes())) {
            line.textContent = status.textContent = stuck;
            return clearInterval(every);
          }
          i = (i + 1) % lines.length;
          line.textContent = lines[i];
        }, 950);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
