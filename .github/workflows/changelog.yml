# Versions are created only when the owner types /ship <version>.
# This fails any change that adds a version to CHANGELOG.md without its
# "Release v<version>" commit, any v* tag that is not that commit, any later
# edit to released notes, and any other version-number drift. Make its job,
# "Versions only via /ship", a required status check on main. It cannot tell
# who made a commit. See scripts/changelog.mjs.
name: Changelog

on:
  pull_request:
  push:
    branches: ['**'] # filtered to the default branch below, whatever it is called
    tags: ['v*']

permissions:
  contents: read

jobs:
  changelog:
    name: Versions only via /ship
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_type == 'tag' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the check reads history back to the base
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the changelog tool
        run: node --test "scripts/*.test.mjs"
      - name: Check CHANGELOG.md
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/changelog.mjs check --base "$PR_BASE"
          elif [ "$REF_TYPE" = tag ]; then
            node scripts/changelog.mjs check --tag "$REF_NAME"
          else
            node scripts/changelog.mjs check --base "$PUSH_BEFORE"
          fi
