# Nightly checks (CLAUDE.md: PR checks stay within 8 minutes; slower checks go nightly and never
# block). I3's full sweep (the M4 spec, item 5; bench/sweep.ts): every headway the line card offers,
# every fare, every bus model and every tier a lone line's stops may take, with and without roadworks,
# on the fixture's debug line and two Inner Boston corridors. Beside it, on GitHub's runner, I14's
# recompute on Inner Boston, a festival's first day included (bench/recompute.ts); I10 on Inner Boston
# (bench/firstline.ts); and the scripted pacing run (the M5 spec, item 1; bench/pacing.ts) on seeds 1-3
# (2 and 3 for 80 days, which the held targets need), which fails when profit, the report card or the
# second line misses PLAN §3's minutes or a balance band moves (EC-12), and only reports gold. And
# PLAN §6's heap budget: 30 minutes of the slow-laptop run's busy scene at 2,700× on the shipped build
# (e2e/heap.spec.ts).
# A failing verdict fails the run; it blocks no merge, and the next session reads it from the run's log.
name: Nightly

on:
  schedule:
    # 07:23 UTC (03:23 in Boston in summer), off the hour so it starts on time.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  sweep:
    name: I3's full sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run bench sweep inner

  measures:
    name: I14's recompute and the pacing run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run bench recompute

      - run: npm run bench firstline
        if: ${{ !cancelled() }}

      - run: npm run bench pacing
        if: ${{ !cancelled() }}
        env:
          PACING_SEED: 1

      - run: npm run bench pacing
        if: ${{ !cancelled() }}
        env:
          PACING_SEED: 2
          PACING_DAYS: 80

      - run: npm run bench pacing
        if: ${{ !cancelled() }}
        env:
          PACING_SEED: 3
          PACING_DAYS: 80

  heap:
    name: PLAN §6's heap budget, 30 minutes of the busy scene
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: 30 minutes of the busy scene at 2,700×, its heaps within 10%
        run: npx playwright test e2e/heap.spec.ts
        env:
          HEAP_MINUTES: 30
