# PR checks (CLAUDE.md: within 8 minutes; slower checks go nightly and never block). Four jobs side by
# side: the browser's took 7.0 minutes as one with the rest, and 8.1 on a slower runner, so the
# typecheck, lint and unit tests run on a runner of their own; and the fixture e2e alone took 5.6 to 7.5
# minutes of the 8 (2026-10-14), so it ran in two halves, Playwright's shards 1/2 and 2/2; the first half,
# beside the builds and the smoke tests, reached 6.7 minutes (#118, 2026-10-15), so it runs in thirds.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install pyosmium for the bake tests (pinned, hashed)
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r tools/bake/requirements.txt

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts

  e2e:
    name: Build, smoke and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run build

      - name: Menu critical path within 200 KiB (I14)
        run: npm run measure:bundle

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # I14's first frame within 2.5 s on the shipped build, timed alone so no other test shares the
      # runner while it times (beside the busy scene's, its median was 1.99 s; e2e/first-frame.spec.ts).
      - name: I14's first frame on the shipped build
        run: npx playwright test e2e/first-frame.spec.ts
        env:
          SHIPPED_BUILD: '1'

      # The build the deploy ships plays Inner Boston: it boots, names its build and draws Boston, and
      # draws every bus of the slow-laptop run's busy scene, 200 and more (the M5 spec, item 9).
      - name: Smoke test the shipped build, with its busy scene
        run: npx playwright test e2e/smoke.spec.ts e2e/scene.spec.ts

      # The e2e tests are written on mini-Boston, so they run on a build that plays it. This job runs
      # a third of them; "Fixture e2e, second third" and "Fixture e2e, last third" run the rest.
      - run: npm run build:fixture
      - run: npm run e2e -- --shard=1/3

  e2e-second-half:
    name: Fixture e2e, second third
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build:fixture
      - run: npm run e2e -- --shard=2/3

  e2e-last-third:
    name: Fixture e2e, last third
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build:fixture
      - run: npm run e2e -- --shard=3/3
