# PR checks (CLAUDE.md: within 8 minutes; slower checks go nightly and never block).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install pyosmium for the bake tests (pinned, hashed)
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r tools/bake/requirements.txt

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts

      - run: npm run build

      - name: Menu critical path within 200 KiB (I14)
        run: npm run measure:bundle

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # I14's first frame within 2.5 s on the shipped build, timed alone so no other test shares the
      # runner while it times (beside the busy scene's, its median was 1.99 s; e2e/first-frame.spec.ts).
      - name: I14's first frame on the shipped build
        run: npx playwright test e2e/first-frame.spec.ts
        env:
          SHIPPED_BUILD: '1'

      # The build the deploy ships plays Inner Boston: it boots, names its build and draws Boston, and
      # draws every bus of the slow-laptop run's busy scene, 200 and more (the M5 spec, item 9).
      - name: Smoke test the shipped build, with its busy scene
        run: npx playwright test e2e/smoke.spec.ts e2e/scene.spec.ts

      # The e2e tests are written on mini-Boston, so they run on a build that plays it.
      - run: npm run build:fixture
      - run: npm run e2e
