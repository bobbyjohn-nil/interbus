# PR checks (CLAUDE.md: within 8 minutes; slower checks go nightly and never block). Four jobs side by
# side: the browser's took 7.0 minutes as one with the rest, and 8.1 on a slower runner, so the
# typecheck, lint and unit tests run on a runner of their own; and the fixture e2e alone took 5.6 to 7.5
# minutes of the 8 (2026-10-14), so it ran in two halves, Playwright's shards 1/2 and 2/2; the first half,
# beside the builds and the smoke tests, reached 6.7 minutes (#118, 2026-10-15), so it ran in thirds; and
# the first third, with Close line's tests, took 8.0 and 8.3 minutes, the limit cancelling the second
# (#149, 2026-10-22), so it runs in quarters: 4.1, 2.7, 1.9 and 3.5 minutes of tests on their first
# run, the first beside the builds in a job of 6.9 and 7.3 minutes, 2.0 and 2.3 of them installing
# Chromium (16 to 44 s in the other quarters' jobs). With the accessibility floor's axe-core runs the
# first quarter took 4.4 minutes and its job 7.3 (#150), apt fetching Chromium's fonts at 263 kB/s
# for 1 min 39 s of them, so the builds and their smoke tests run on a runner of their own.
# Chromium's install keeps apt's packages between runs (.github/actions/chromium), apt once taking
# 8 min 18 s to fetch them and the limit cancelling a quarter before its tests began (#152). The first
# quarter's tests took 6.9 minutes on c0e10bb, a job of 7.4, and with the fifteenth audit round's 7.6,
# the limit cancelling it as they ended (#177), so the e2e ran in fifths. The shards share the tests out by file, and a
# file runs whole on one of a job's two workers: keyboard.spec.ts, 37 tests, took 6.9 minutes of its fifth's 7.0 on #184's
# push run, a job of 7.6, its other worker done in under 3, so the hand-offs of a stop's, a contract's and a day's buttons
# run from focusback.spec.ts. With the eighteenth audit round's first lane's tests the last fifth's took 7.5 minutes on
# #188's pull request run, a job of 8.1, the limit cancelling it as they ended (5.2 on its push run, a job of 5.9), so the
# e2e runs in sixths.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install pyosmium for the bake tests (pinned, hashed)
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r tools/bake/requirements.txt

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts

  build:
    name: Build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - run: npm run build

      - name: Menu critical path within 200 KiB (I14)
        run: npm run measure:bundle

      - name: Install Playwright's Chromium
        uses: ./.github/actions/chromium

      # I14's first frame within 2.5 s on the shipped build, timed alone so no other test shares the
      # runner while it times (beside the busy scene's, its median was 1.99 s; e2e/first-frame.spec.ts).
      - name: I14's first frame on the shipped build
        run: npx playwright test e2e/first-frame.spec.ts
        env:
          SHIPPED_BUILD: '1'

      # The build the deploy ships plays Inner Boston: it boots, names its build and draws Boston, and
      # draws every bus of the slow-laptop run's busy scene, 200 and more (the M5 spec, item 9).
      - name: Smoke test the shipped build, with its busy scene
        run: npx playwright test e2e/smoke.spec.ts e2e/scene.spec.ts

  # The e2e tests are written on mini-Boston, so they run on a build that plays it, in sixths on six runners: this
  # one and "Fixture e2e, second sixth", "third sixth", "fourth sixth", "fifth sixth" and "last sixth".
  e2e-first-sixth:
    name: Fixture e2e, first sixth
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore fonts
        uses: actions/cache@v6
        with:
          path: |
            public/fonts
            .cache/fonts
          # fontnik draws the glyph ranges, so its installed version is part of the key.
          key: fonts-${{ hashFiles('scripts/fonts/**', 'node_modules/fontnik/package.json') }}

      - run: npm run fonts

      - name: Restore city files
        uses: actions/cache@v6
        with:
          path: public/cities
          key: cities-${{ hashFiles('cities/index.json') }}

      - run: npm run cities

      - name: Install Playwright's Chromium
        uses: ./.github/actions/chromium

      - run: npm run build:fixture
      - run: npm run e2e -- --shard=1/6

  e2e-second-sixth:
    name: Fixture e2e, second sixth
    runs-on: ubuntu-24.04
