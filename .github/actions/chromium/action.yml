# Playwright's Chromium and the system packages it needs, for the CI jobs that run a browser. apt
# fetched those packages, 25.9 MB of fonts and libraries, from the runner's mirror at 52 kB/s for
# 8 min 18 s, and the 8-minute limit cancelled the job (#152, 2026-10-22); on other runs it took
# 1 min 39 s (#150) and 4 min 30 s. So the packages apt downloads are kept in the Actions cache and
# put back in apt's own folder before it runs. apt still checks each one against the archive's signed
# index, and fetches any it lacks or that is out of date. A runner image's installed packages decide
# what apt fetches, so each image keeps its own set; an image with none yet starts from the newest set
# of another (#153: the newest set of any held only the fonts, and apt fetched 4.9 MB of libraries).
# On an exact match the image's own set is installed as it was fetched, with dpkg and no apt-get update:
# apt checks the archive's index first, and on #156's push run its mirror stalled, apt-get update hung for
# 7 minutes and the 8-minute limit cancelled the job before its tests began. Playwright then fetches only
# its browser. A set that does not install, or any other match, goes through apt as before.
name: Install Playwright's Chromium
description: Playwright's Chromium and its system packages, with apt's downloads kept between runs
runs:
  using: composite
  steps:
    - name: Name the runner image's set
      id: image
      shell: bash
      run: echo "key=apt-chromium-${ImageOS:-linux}-${ImageVersion:-unknown}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"

    - name: Restore apt's packages for Chromium
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.image.outputs.key }}
        restore-keys: apt-chromium-

    - name: Install Playwright's Chromium and its system packages
      shell: bash
      run: |
        mkdir -p ~/apt-archives
        echo "apt's packages for Chromium restored: $(ls ~/apt-archives | wc -l) files, from ${{ steps.restore.outputs.cache-matched-key || 'no set' }}"
        if [ "${{ steps.restore.outputs.cache-hit }}" = "true" ] && compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then
          if sudo dpkg -i ~/apt-archives/*.deb > "$RUNNER_TEMP/dpkg.log" 2>&1; then
            echo "This image's set installed with dpkg, no apt-get update: $(grep -c '^Setting up' "$RUNNER_TEMP/dpkg.log") packages set up"
            npx playwright install chromium
            exit 0
          fi
          echo "This image's set did not install with dpkg; apt from here:"
          tail -n 20 "$RUNNER_TEMP/dpkg.log"
        fi
        sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        npx playwright install --with-deps chromium
        # Keep what the archive still serves: the set restored and what apt fetched.
        sudo apt-get autoclean -qq
        rm -f ~/apt-archives/*.deb
        cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
        echo "apt's packages for Chromium kept: $(ls ~/apt-archives | wc -l) files, $(du -sh ~/apt-archives | cut -f1)"

    - name: Keep apt's packages for Chromium
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.image.outputs.key }}
